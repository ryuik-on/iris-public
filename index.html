<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/iris.svg" />
  <!--
    Installable, so IRIS gets a window of its own.

    The server has always been resident — launchd starts it at login and keeps
    it up. What was not resident was the window: it lived in a browser tab and
    had to be found again every time. With a manifest, Safari's Add to Dock and
    Chrome's Open as window both give it a Dock icon, its own ⌘-Tab entry and
    no browser chrome, which is the whole difference between a page and an app.
    The same file is what puts it on an iPhone home screen.
  -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/iris-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IRIS" />
  <meta name="theme-color" content="#05080e" />
  <title>IRIS</title>
</head>
<body class="bg-zinc-950 text-zinc-100">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
